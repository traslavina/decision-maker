<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decision Maker - Make Confident Decisions</title>
  <meta name="description" content="A simple, elegant tool for making better decisions using weighted scoring.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React and ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
  
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { Plus, X, ChevronDown, ChevronUp, Award, TrendingUp } = lucide;

    function DecisionMaker() {
      const [decisionName, setDecisionName] = useState('');
      const [criteria, setCriteria] = useState([]);
      const [options, setOptions] = useState([]);
      const [expandedSections, setExpandedSections] = useState({
        criteria: true,
        options: true,
        results: true
      });

      // Add initial example data
      useEffect(() => {
        setDecisionName('Job Comparison');
        setCriteria([
          { id: 1, name: 'Base Salary', weight: 4 },
          { id: 2, name: 'Equity (RSUs)', weight: 4 },
          { id: 3, name: 'Work-Life Balance', weight: 5 },
          { id: 4, name: 'Growth Opportunity', weight: 5 },
          { id: 5, name: 'Company Culture', weight: 5 }
        ]);
        setOptions([
          { 
            id: 1, 
            name: 'Current Role',
            scores: { 1: 5, 2: 3, 3: 5, 4: 3, 5: 5 }
          },
          { 
            id: 2, 
            name: 'Company B',
            scores: { 1: 4, 2: 5, 3: 4, 4: 5, 5: 5 }
          }
        ]);
      }, []);

      const addCriterion = () => {
        const newId = criteria.length > 0 ? Math.max(...criteria.map(c => c.id)) + 1 : 1;
        setCriteria([...criteria, { id: newId, name: '', weight: 3 }]);
      };

      const updateCriterion = (id, field, value) => {
        setCriteria(criteria.map(c => 
          c.id === id ? { ...c, [field]: field === 'weight' ? Number(value) : value } : c
        ));
      };

      const removeCriterion = (id) => {
        setCriteria(criteria.filter(c => c.id !== id));
        setOptions(options.map(opt => {
          const newScores = { ...opt.scores };
          delete newScores[id];
          return { ...opt, scores: newScores };
        }));
      };

      const addOption = () => {
        const newId = options.length > 0 ? Math.max(...options.map(o => o.id)) + 1 : 1;
        const scores = {};
        criteria.forEach(c => { scores[c.id] = 3; });
        setOptions([...options, { id: newId, name: '', scores }]);
      };

      const updateOption = (id, field, value) => {
        setOptions(options.map(o => 
          o.id === id ? { ...o, [field]: value } : o
        ));
      };

      const updateScore = (optionId, criterionId, value) => {
        setOptions(options.map(o => 
          o.id === optionId 
            ? { ...o, scores: { ...o.scores, [criterionId]: Number(value) } }
            : o
        ));
      };

      const removeOption = (id) => {
        setOptions(options.filter(o => o.id !== id));
      };

      const calculateWeightedScore = (option) => {
        return criteria.reduce((total, criterion) => {
          const score = option.scores[criterion.id] || 0;
          return total + (criterion.weight * score);
        }, 0);
      };

      const getResults = () => {
        return options
          .map(option => ({
            ...option,
            totalScore: calculateWeightedScore(option)
          }))
          .sort((a, b) => b.totalScore - a.totalScore);
      };

      const results = getResults();
      const maxScore = results.length > 0 ? results[0].totalScore : 0;

      const toggleSection = (section) => {
        setExpandedSections(prev => ({ ...prev, [section]: !prev[section] }));
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 p-4 md:p-8">
          <div className="max-w-5xl mx-auto">
            {/* Header */}
            <div className="text-center mb-12 mt-8">
              <h1 className="text-4xl md:text-5xl font-semibold text-gray-900 mb-3 tracking-tight">
                Decision Maker
              </h1>
              <p className="text-lg text-gray-500 font-normal">
                Make confident decisions with clarity.
              </p>
            </div>

            {/* Decision Name */}
            <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8 mb-6 transition-all hover:shadow-md">
              <label className="block text-sm font-medium text-gray-700 mb-3">
                Decision Name
              </label>
              <input
                type="text"
                value={decisionName}
                onChange={(e) => setDecisionName(e.target.value)}
                placeholder="e.g., Hiring Decision, Vendor Selection"
                className="w-full px-4 py-3 text-lg border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
              />
            </div>

            {/* Criteria Section */}
            <div className="bg-white rounded-2xl shadow-sm border border-gray-200 mb-6 transition-all hover:shadow-md">
              <button
                onClick={() => toggleSection('criteria')}
                className="w-full px-6 md:px-8 py-6 flex items-center justify-between text-left hover:bg-gray-50 transition-colors rounded-t-2xl"
              >
                <div>
                  <h2 className="text-xl font-semibold text-gray-900">Criteria & Weights</h2>
                  <p className="text-sm text-gray-500 mt-1">What matters in this decision?</p>
                </div>
                {React.createElement(expandedSections.criteria ? ChevronUp : ChevronDown, { 
                  className: "text-gray-400", 
                  size: 24 
                })}
              </button>

              {expandedSections.criteria && (
                <div className="px-6 md:px-8 pb-6">
                  <div className="space-y-3 mb-4">
                    {criteria.map((criterion, index) => (
                      <div 
                        key={criterion.id} 
                        className="flex items-center gap-3 p-4 bg-gray-50 rounded-xl transition-all hover:bg-gray-100"
                      >
                        <input
                          type="text"
                          value={criterion.name}
                          onChange={(e) => updateCriterion(criterion.id, 'name', e.target.value)}
                          placeholder="Criterion name"
                          className="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white"
                        />
                        <div className="flex items-center gap-2">
                          <label className="text-sm text-gray-600 whitespace-nowrap">Weight:</label>
                          <select
                            value={criterion.weight}
                            onChange={(e) => updateCriterion(criterion.id, 'weight', e.target.value)}
                            className="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white min-w-[80px]"
                          >
                            <option value="1">1 - Low</option>
                            <option value="2">2</option>
                            <option value="3">3 - Mid</option>
                            <option value="4">4</option>
                            <option value="5">5 - High</option>
                          </select>
                        </div>
                        <button
                          onClick={() => removeCriterion(criterion.id)}
                          className="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all"
                          title="Remove criterion"
                        >
                          {React.createElement(X, { size: 20 })}
                        </button>
                      </div>
                    ))}
                  </div>

                  <button
                    onClick={addCriterion}
                    className="w-full py-3 px-4 border-2 border-dashed border-gray-300 rounded-xl text-gray-600 hover:border-blue-500 hover:text-blue-600 hover:bg-blue-50 transition-all flex items-center justify-center gap-2 font-medium"
                  >
                    {React.createElement(Plus, { size: 20 })}
                    Add Criterion
                  </button>
                </div>
              )}
            </div>

            {/* Options Section */}
            <div className="bg-white rounded-2xl shadow-sm border border-gray-200 mb-6 transition-all hover:shadow-md">
              <button
                onClick={() => toggleSection('options')}
                className="w-full px-6 md:px-8 py-6 flex items-center justify-between text-left hover:bg-gray-50 transition-colors rounded-t-2xl"
              >
                <div>
                  <h2 className="text-xl font-semibold text-gray-900">Options & Scores</h2>
                  <p className="text-sm text-gray-500 mt-1">Rate each option per criterion</p>
                </div>
                {React.createElement(expandedSections.options ? ChevronUp : ChevronDown, { 
                  className: "text-gray-400", 
                  size: 24 
                })}
              </button>

              {expandedSections.options && (
                <div className="px-6 md:px-8 pb-6">
                  <div className="space-y-6">
                    {options.map((option) => (
                      <div 
                        key={option.id}
                        className="border border-gray-200 rounded-xl p-5 bg-gray-50 transition-all hover:shadow-sm"
                      >
                        <div className="flex items-center gap-3 mb-4">
                          <input
                            type="text"
                            value={option.name}
                            onChange={(e) => updateOption(option.id, 'name', e.target.value)}
                            placeholder="Option name"
                            className="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white font-medium"
                          />
                          <button
                            onClick={() => removeOption(option.id)}
                            className="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all"
                            title="Remove option"
                          >
                            {React.createElement(X, { size: 20 })}
                          </button>
                        </div>

                        <div className="grid gap-3">
                          {criteria.map((criterion) => (
                            <div 
                              key={criterion.id}
                              className="flex items-center justify-between gap-4 bg-white p-3 rounded-lg"
                            >
                              <span className="text-sm text-gray-700 flex-1">
                                {criterion.name || 'Unnamed criterion'}
                              </span>
                              <div className="flex items-center gap-2">
                                <input
                                  type="range"
                                  min="1"
                                  max="5"
                                  value={option.scores[criterion.id] || 3}
                                  onChange={(e) => updateScore(option.id, criterion.id, e.target.value)}
                                  className="w-24 accent-blue-500"
                                />
                                <span className="text-sm font-medium text-gray-900 w-12 text-center">
                                  {option.scores[criterion.id] || 3} / 5
                                </span>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>

                  <button
                    onClick={addOption}
                    className="w-full mt-4 py-3 px-4 border-2 border-dashed border-gray-300 rounded-xl text-gray-600 hover:border-blue-500 hover:text-blue-600 hover:bg-blue-50 transition-all flex items-center justify-center gap-2 font-medium"
                  >
                    {React.createElement(Plus, { size: 20 })}
                    Add Option
                  </button>
                </div>
              )}
            </div>

            {/* Results Section */}
            {results.length > 0 && (
              <div className="bg-white rounded-2xl shadow-sm border border-gray-200 mb-6 transition-all hover:shadow-md">
                <button
                  onClick={() => toggleSection('results')}
                  className="w-full px-6 md:px-8 py-6 flex items-center justify-between text-left hover:bg-gray-50 transition-colors rounded-t-2xl"
                >
                  <div>
                    <h2 className="text-xl font-semibold text-gray-900">Results</h2>
                    <p className="text-sm text-gray-500 mt-1">Based on your weighting and scoring</p>
                  </div>
                  {React.createElement(expandedSections.results ? ChevronUp : ChevronDown, { 
                    className: "text-gray-400", 
                    size: 24 
                  })}
                </button>

                {expandedSections.results && (
                  <div className="px-6 md:px-8 pb-6">
                    <div className="space-y-3">
                      {results.map((result, index) => {
                        const isTop = index === 0;
                        const scorePercentage = maxScore > 0 ? (result.totalScore / maxScore) * 100 : 0;

                        return (
                          <div
                            key={result.id}
                            className={`p-5 rounded-xl border-2 transition-all ${
                              isTop 
                                ? 'bg-blue-50 border-blue-500 shadow-sm' 
                                : 'bg-gray-50 border-gray-200'
                            }`}
                          >
                            <div className="flex items-center justify-between mb-3">
                              <div className="flex items-center gap-3">
                                {isTop && (
                                  <div className="p-2 bg-blue-500 rounded-lg">
                                    {React.createElement(Award, { className: "text-white", size: 20 })}
                                  </div>
                                )}
                                <div>
                                  <h3 className="text-lg font-semibold text-gray-900">
                                    {result.name}
                                  </h3>
                                  {isTop && (
                                    <span className="text-sm text-blue-600 font-medium">
                                      Recommended Choice
                                    </span>
                                  )}
                                </div>
                              </div>
                              <div className="text-right">
                                <div className="text-2xl font-bold text-gray-900">
                                  {result.totalScore}
                                </div>
                                <div className="text-sm text-gray-500">
                                  total score
                                </div>
                              </div>
                            </div>

                            {/* Score bar */}
                            <div className="h-2 bg-gray-200 rounded-full overflow-hidden">
                              <div
                                className={`h-full transition-all duration-500 ${
                                  isTop ? 'bg-blue-500' : 'bg-gray-400'
                                }`}
                                style={{ width: `${scorePercentage}%` }}
                              />
                            </div>

                            {/* Breakdown */}
                            <div className="mt-4 grid grid-cols-2 md:grid-cols-3 gap-2 text-xs">
                              {criteria.map(criterion => {
                                const score = result.scores[criterion.id] || 0;
                                const weighted = criterion.weight * score;
                                return (
                                  <div 
                                    key={criterion.id}
                                    className="bg-white px-2 py-1.5 rounded flex justify-between items-center"
                                  >
                                    <span className="text-gray-600 truncate mr-2">
                                      {criterion.name}
                                    </span>
                                    <span className="font-medium text-gray-900 whitespace-nowrap">
                                      {weighted}
                                    </span>
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    {results.length > 1 && (
                      <div className="mt-6 p-4 bg-gray-50 rounded-xl border border-gray-200">
                        <div className="flex items-start gap-3">
                          {React.createElement(TrendingUp, { className: "text-blue-500 mt-0.5", size: 20 })}
                          <div>
                            <h4 className="font-medium text-gray-900 mb-1">Confidence Note</h4>
                            <p className="text-sm text-gray-600">
                              {results[0].name} leads by {results[0].totalScore - results[1].totalScore} points.
                              {results[0].totalScore - results[1].totalScore > 30 
                                ? ' This is a clear frontrunner.' 
                                : ' Consider if the criteria weights reflect your true priorities.'}
                            </p>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {/* Footer */}
            <div className="text-center text-sm text-gray-500 mt-8 mb-4">
              <p>All data stays in your browser. Nothing is saved or shared.</p>
            </div>
          </div>
        </div>
      );
    }

    // Render the app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DecisionMaker />);

    // Initialize Lucide icons
    lucide.createIcons();
  </script>
</body>
</html>
